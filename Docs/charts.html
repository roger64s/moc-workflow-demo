<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MOC Workflow Project Charts</title><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><style>body{font-family:Segoe UI,sans-serif;margin:0;padding:24px;background:#f4f7fb;color:#172033}main{max-width:1100px;margin:auto}h1{color:#0f766e}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:18px}.card{background:#fff;padding:18px;border-radius:10px;box-shadow:0 4px 16px #17203318}.wide{grid-column:1/-1}canvas{max-height:330px}</style></head><body><main><h1>MOC Workflow Demo Metrics</h1><div class="grid"><section class="card"><canvas id="time"></canvas></section><section class="card"><canvas id="loc"></canvas></section><section class="card wide"><canvas id="effort"></canvas></section><section class="card"><canvas id="hours"></canvas></section><section class="card"><canvas id="category"></canvas></section></div></main><script>
const labels=['2026'];const data=[50,25,15,7,3];const cats=['Coding','Testing','Rework','Deployment','Planning'];const colors=['#0f766e','#2563eb','#f97316','#eab308','#7c3aed'];
new Chart(time,{type:'pie',data:{labels:cats,datasets:[{data,backgroundColor:colors}]},options:{plugins:{title:{display:true,text:'Time Distribution (%)'}}}});
new Chart(loc,{type:'bar',data:{labels,datasets:[{label:'Effort units',data:[75],backgroundColor:'#0f766e'}]},options:{plugins:{title:{display:true,text:'Effort by Date'}},scales:{y:{beginAtZero:true}}}});
new Chart(effort,{type:'bar',data:{labels,datasets:cats.map((label,i)=>({label,data:[data[i]],backgroundColor:colors[i]}))},options:{plugins:{title:{display:true,text:'Effort Breakdown'}},scales:{x:{stacked:true},y:{stacked:true,beginAtZero:true}}}});
new Chart(hours,{type:'line',data:{labels,datasets:[{label:'Estimated effort units',data:[75],borderColor:'#2563eb',backgroundColor:'#2563eb'}]},options:{plugins:{title:{display:true,text:'Calendar Effort'}},scales:{y:{beginAtZero:true}}}});
new Chart(category,{type:'bar',data:{labels:cats,datasets:[{label:'Effort units',data,backgroundColor:colors}]},options:{indexAxis:'y',plugins:{title:{display:true,text:'Total Effort by Category'}},scales:{x:{beginAtZero:true}}}});
</script></body></html>
