<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MOC Workflow Project Charts</title><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script><style>body{font-family:Segoe UI,sans-serif;margin:0;padding:24px;background:#f4f7fb;color:#172033}main{max-width:1100px;margin:auto}h1{color:#0f766e}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:18px}.card{background:#fff;padding:18px;border-radius:10px;box-shadow:0 4px 16px #17203318}.wide{grid-column:1/-1}canvas{max-height:330px}</style></head><body><main><h1>MOC Workflow Demo Metrics</h1><div class="grid"><section class="card"><canvas id="time"></canvas></section><section class="card"><canvas id="loc"></canvas></section><section class="card wide"><canvas id="effort"></canvas></section><section class="card"><canvas id="hours"></canvas></section><section class="card"><canvas id="category"></canvas></section></div></main><script>
Chart.register(ChartDataLabels);Chart.defaults.plugins.datalabels={color:context=>{const bg=Array.isArray(context.dataset.backgroundColor)?context.dataset.backgroundColor[context.dataIndex]:context.dataset.backgroundColor;const hex=String(bg||'#fff').replace('#','');const rgb=hex.length===3?hex.split('').map(v=>parseInt(v+v,16)):[parseInt(hex.slice(0,2),16),parseInt(hex.slice(2,4),16),parseInt(hex.slice(4,6),16)];return (0.299*rgb[0]+0.587*rgb[1]+0.114*rgb[2])/255<0.58?'#fff':'#172033'},font:context=>({weight:'bold',size:Math.max(9,Math.min(12,context.chart.width/75))}),formatter:value=>value.toLocaleString()};
const labels=['Aug 05','Aug 16','Aug 17'];const data=[50,25,15,7,3];const cats=['Coding','Testing','Rework','Deployment','Planning'];const colors=['#0f766e','#2563eb','#f97316','#eab308','#7c3aed'];
new Chart(time,{type:'pie',data:{labels:cats,datasets:[{data,backgroundColor:colors}]},options:{plugins:{title:{display:true,text:'Time Distribution (%)'}}}});
new Chart(loc,{type:'bar',data:{labels,datasets:[{label:'Effort units',data:[70,20,5],backgroundColor:'#0f766e'}]},options:{plugins:{title:{display:true,text:'Effort by Date'}},scales:{y:{beginAtZero:true}}}});
new Chart(effort,{type:'bar',data:{labels,datasets:[{label:'Coding',data:[35,10,2],backgroundColor:colors[0]},{label:'Testing',data:[18,5,1],backgroundColor:colors[1]},{label:'Rework',data:[10,3,1],backgroundColor:colors[2]},{label:'Deployment',data:[5,1,1],backgroundColor:colors[3]},{label:'Planning',data:[2,1,0],backgroundColor:colors[4]}]},options:{plugins:{title:{display:true,text:'Effort Breakdown'}},scales:{x:{stacked:true},y:{stacked:true,beginAtZero:true}}}});
new Chart(hours,{type:'line',data:{labels,datasets:[{label:'Estimated hours',data:[10,3,1],borderColor:'#2563eb',backgroundColor:'#2563eb'}]},options:{plugins:{title:{display:true,text:'Calendar Effort'}},scales:{y:{beginAtZero:true}}}});
new Chart(category,{type:'bar',data:{labels:cats,datasets:[{label:'Effort units',data:[47,24,14,7,3],backgroundColor:colors}]},options:{indexAxis:'y',plugins:{title:{display:true,text:'Total Effort by Category'}},scales:{x:{beginAtZero:true}}}});
</script></body></html>
